name: Release

on:
  push:
    branches: [main]

# Only one release run at a time so the "Version Packages" PR and any publish
# don't race each other.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push tags, create GitHub releases, open the version PR
  pull-requests: write # create/update the "Version Packages" PR
  id-token: write # npm provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Creates/updates a "Version Packages" PR from pending changesets, and once
      # that PR is merged, runs `pnpm release` to build (tsc --noCheck) and
      # `changeset publish` the changed packages to npm.
      - name: Create Release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
