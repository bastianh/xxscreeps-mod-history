name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CI has no sibling xxscreeps checkout, so it can't strict-typecheck
      # against those types. build:ci / test:ci transpile with `tsc --noCheck`,
      # emitting JS + .d.ts (which still reference the real xxscreeps types).
      - name: Build & test
        run: pnpm test:ci
